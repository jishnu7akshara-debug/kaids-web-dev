<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Sign In | KAIDS</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" href="../assets/img/favicon-32.png">
</head>
<body style="background: var(--paper); min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;">
  <main style="width: 100%; max-width: 24rem; background: var(--white); border: 1px solid var(--line); padding: 2.5rem 2rem;">
    <div style="display: flex; align-items: center; gap: .75rem; margin-bottom: 2rem;">
      <img src="../assets/img/kaids-seal.webp" width="48" height="48" alt="">
      <div>
        <h1 style="font-size: 1.25rem; font-weight: 600; margin: 0;">KAIDS Admin</h1>
        <p class="note" style="margin: 0;">Staff &amp; Liaison Portal</p>
      </div>
    </div>

    <form id="login-form" style="display: grid; gap: 1.25rem;" novalidate>
      <div class="field">
        <label for="admin-email">Email</label>
        <input id="admin-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="admin-password">Password</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="field-error" role="alert" style="margin: 0;"></p>
      <button class="btn" type="submit" id="login-btn" style="width: 100%;">Sign in</button>
    </form>
  </main>

  <script type="module">
    const form = document.getElementById('login-form');
    const errBox = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.textContent = '';
      btn.disabled = true;

      const email = form.email.value.trim();
      const password = form.password.value;

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errBox.textContent = data.error || 'Email or password is incorrect';
          return;
        }
        window.location.href = '/admin/';
      } catch {
        errBox.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
