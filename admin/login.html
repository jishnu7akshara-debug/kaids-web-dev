<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Sign In | KAIDS</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" href="../assets/img/favicon-32.png">
</head>
<body class="admin-login-body">
  <main class="admin-login-card">
    <div class="admin-login-brand">
      <img src="../assets/img/kaids-seal.webp" width="48" height="48" alt="">
      <div>
        <h1>KAIDS Admin</h1>
        <p class="note">Staff &amp; Liaison Portal</p>
      </div>
    </div>

    <form id="login-form" class="admin-login-form" novalidate>
      <div class="field">
        <label for="admin-email">Email</label>
        <input id="admin-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="admin-password">Password</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="field-error" role="alert"></p>
      <button class="btn admin-login-btn" type="submit" id="login-btn">Sign in</button>
    </form>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
